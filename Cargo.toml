[package]
name = "dw3000_sleep_experiment"
version = "0.1.0"
edition = "2024"

[features]
default = ["board-l431"]
# Select exactly one board (chooses the embassy-stm32 chip, time driver and the
# DW3000 reset pin, see src/main.rs).
# `time-driver-any` picks TIM1 first on STM32F103 (advanced-control timer);
# that leaves the embassy time driver dead (Timer::after never resolves), so
# board-bu03 pins the driver to TIM2 explicitly instead.
board-l431 = ["embassy-stm32/stm32l431cc", "embassy-stm32/time-driver-any"]
board-bu03 = ["embassy-stm32/stm32f103cb", "embassy-stm32/time-driver-tim2"]
role-responder = []
sleep-experiment = []

[dependencies]
# Chip and time driver are selected via the `board-*` features above; do not add them here.
embassy-stm32 = { version = "0.6.0", default-features = false, features = [
  "defmt",
  "unstable-pac",
  "exti",
  "chrono",
  "rt",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-time = { version = "0.5.1", features = [
  "defmt",
  "defmt-timestamp-uptime",
  "tick-hz-32_768",
] }
embassy-embedded-hal = { version = "0.6.0" }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-net-adin1110 = { version = "0.4.0" }
embassy-net = { version = "0.9.1", features = [
  "defmt",
  "udp",
  "tcp",
  "dhcpv4",
  "medium-ethernet",
] }
embassy-futures = { version = "0.1.2" }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
embedded-io = { version = "0.7.1", features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embedded-hal = "0.2.6"
embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-hal-bus = { version = "0.1", features = ["async"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = { version = "0.9", default-features = false }
chrono = { version = "^0.4", default-features = false }
static_cell = "2"

micromath = "2.0.0"

dw3000-ng = "1.0.2"
smoltcp = { version = "0.13", default-features = false, features = [
  "medium-ieee802154",
  "defmt",
] }
nb = "1.0"

spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }
embedded-alloc = { version = "0.7.0", default-features = false, features = [
  "llff",
] }

[profile.release]
debug = 2

[package.metadata.embassy]
build = [
  { target = "thumbv7em-none-eabi", artifact-dir = "out/examples/stm32l4" },
]

[[bin]]
name = "stm32l4_hello_world_embassy"
path = "src/main.rs"
test = false
doctest = false
bench = false
